name: Wrong conversion result / 转换结果不对
description: No error, but the colour or tone is wrong / 程序没报错，但出来的颜色/影调不对
labels: [color]
body:
  - type: markdown
    attributes:
      value: |
        This one **needs files**. Every step is deterministic: the same input plus the same
        `.ncproj` produces the same image on any machine — so with both, this is always
        reproducible. Without them, nobody can do more than guess.

        ---

        这类问题**必须有文件才能查**。这个程序的每一步都是确定性的：同样的输入加同样的
        `.ncproj`，在任何机器上都出同一张图。所以只要你给得出这两样，问题一定能被复现和定位；
        给不出的话，任何人都只能猜。
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong / 哪里不对
      description: "Colour cast, grey shadows, clipped highlights? What is your reference? / 偏色、暗部发灰、高光溢出？参考是什么？"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Source file + .ncproj / 源文件 + .ncproj
      description: |
        Upload a ZIP with a minimal reproduction that contains no private content.
        上传不含隐私、能够复现问题的最小 ZIP 文件。
    validations:
      required: true
  - type: textarea
    id: readings
    attributes:
      label: Calibration readings / 标定读数
      description: |
        Enter the three-channel base (D_min) and highlight (D_max) readings from roll calibration.
        「整卷校准」页里的片基（D_min）与高光（D_max）三个数。
        橙色片基应当 R<G<B（典型 ~0.09 / 0.29 / 0.54），明显不符往往就是问题所在。
      placeholder: "D_min: 0.09 / 0.29 / 0.54    D_max: 2.21 / 2.34 / 2.79"
  - type: input
    id: source
    attributes:
      label: Stock and light source / 底片与光源
      placeholder: "Kodak Gold 200，翻拍，某某灯箱 / scanned on ..."
  - type: input
    id: version
    attributes:
      label: Version / 版本
    validations:
      required: true
