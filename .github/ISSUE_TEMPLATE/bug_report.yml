name: Bug report / 报告问题
description: Crash, error, or wrong behaviour / 程序崩溃、报错，或行为不符合预期
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **If this is about colour being wrong, please attach the
        source file and its `.ncproj`** — without both, most colour issues cannot be reproduced.
        Share only a minimal reproduction you have permission to publish, without private content.
        If it cannot be shared publicly, describe the issue first and agree on a sharing method with the maintainer.

        ---

        谢谢你花时间报告问题。

        **如果问题和「转出来颜色不对」有关，请务必附上源文件和 `.ncproj`**——
        没有这两样，多数颜色问题在别人机器上复现不出来，issue 只能靠猜。
        请仅分享有权公开且不含隐私的最小复现文件；如不便公开，请先描述问题，与维护者商定分享方式。
  - type: textarea
    id: what
    attributes:
      label: What happened / 发生了什么
      description: What you did, expected, and got / 你做了什么，期望看到什么，实际看到什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Import ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: From Help → About / 「帮助 → 关于」里的版本号
      placeholder: "1.6.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS / 系统
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source file type / 源文件类型
      description: Camera + RAW format, or scanner + bit depth / 相机型号 + RAW 格式，或扫描仪型号 + 位深
      placeholder: "Sony A7III / .ARW，或 Flextight X5 / 16-bit TIFF"
  - type: textarea
    id: files
    attributes:
      label: Source file and .ncproj / 源文件与工程
      description: |
        **Required for colour issues.** Drag files here (zip RAW files — GitHub rejects raw extensions).
        **颜色问题必填。** 把文件拖进这个框即可上传（RAW 请压成 .zip 再传）。
  - type: textarea
    id: logs
    attributes:
      label: Error message / 报错信息
      description: Paste any crash dialog or console output / 如果有崩溃对话框或终端输出，整段贴进来
      render: text
