name: Feature request / 功能建议
description: Suggest a feature or improvement / 希望增加或改进某个功能
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth skimming the README's "three principles" and "who it's for" first — some things
        are deliberately out of scope, and the README says which.

        ---

        提之前值得先看一眼 README 的「三条原则」和「适合谁」。这个项目**有意**不做某些事——
        比如逐卷色卡标定（那是 DiVERE 的领域），或者给 Stage 2 加一组对数域滑块（那会让两个
        控件抢同一个自由度）。不是所有建议都会被接受，但都会被认真回复。
  - type: textarea
    id: problem
    attributes:
      label: What problem are you solving / 你想解决什么问题
      description: Describe the problem before proposing a solution. / 请先描述问题，再提出方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind / 你设想的做法
  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today / 现在你是怎么绕过去的
