name: ci

# 三个平台各自构建固定版本的 app-owned Little CMS，再编译、测试和检查 publish 产物。
# native ABI、动态库命名与 RID 装配都只能由对应平台可靠验证，不能再由一格 Linux
# 交叉 publish 代替。

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 构建固定 Little CMS 2.19.1
        run: bash packaging/lcms/build-unix.sh
      # -warnaserror：本仓库长期保持 0 警告，退化了应当在这里就红
      - run: dotnet build -c Release -warnaserror
      # 回归测试。整套约 10 秒，而它守的是这个项目的核心承诺 ——「同一卷底片任何时候、
      # 任何机器上处理，结果都一样」。测试里每一条都对应一个已经踩过一次的坑（有色高光
      # 单通道截断、裁切没跟着方向走、片基透的卷齿孔漏检……），不在 CI 跑就等于没有。
      - run: dotnet test -c Release --no-build --nologo
      # 跨平台 publish 能力本身也要守住：Core 的 runtime 包是按 RID 条件挑的，
      # 挑错了在这一步就会缺原生库。
      - run: dotnet publish src/OpenRevelare.Gui -c Release -r linux-x64 --self-contained true -o /tmp/pub
      - name: 装配 app-owned Little CMS
        run: |
          install -m 0755 native/linux-x64/liblcms2.so.2 /tmp/pub/liblcms2.so.2
          install -m 0755 native/linux-x64/liblcms2.so /tmp/pub/liblcms2.so
          install -m 0644 native/linux-x64/lcms2.manifest.json /tmp/pub/lcms2.manifest.json
          cmp -s native/linux-x64/liblcms2.so.2 /tmp/pub/liblcms2.so.2
      - name: 产物自检
        run: |
          test -f /tmp/pub/OpenRevelare          || { echo "缺主程序"; exit 1; }
          test -f /tmp/pub/libraw_r.so.23         || { echo "缺 LibRaw 原生库"; exit 1; }
          test -f /tmp/pub/liblcms2.so.2          || { echo "缺 app-owned Little CMS"; exit 1; }
          test -f /tmp/pub/liblcms2.so            || { echo "缺 Little CMS loader alias"; exit 1; }
          test -f /tmp/pub/lcms2.manifest.json    || { echo "缺 Little CMS manifest"; exit 1; }
          test -f /tmp/pub/models/net_awb.onnx    || { echo "缺 Deep-WB 模型"; exit 1; }
          ls /tmp/pub/*.dll > /dev/null

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 构建固定 Little CMS 2.19.1
        shell: pwsh
        run: ./packaging/lcms/build-windows.ps1
      - name: 构建可重复 Win32 presenter
        shell: pwsh
        run: ./packaging/windows/build-win32-presenter.ps1
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test -c Release --no-build --nologo
      - name: publish + 装配 app-owned Little CMS
        shell: pwsh
        run: |
          $pub = Join-Path $env:RUNNER_TEMP "openrevelare-publish"
          dotnet publish src/OpenRevelare.Gui -c Release -r win-x64 --self-contained true -warnaserror -o $pub
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败（$LASTEXITCODE）" }
          Copy-Item -LiteralPath native/win-x64/lcms2.dll -Destination (Join-Path $pub "lcms2.dll") -Force
          Copy-Item -LiteralPath native/win-x64/lcms2.manifest.json -Destination (Join-Path $pub "lcms2.manifest.json") -Force
          $presenterDll = "OpenRevelare.Presentation.Win32.Native.dll"
          $presenterManifest = "OpenRevelare.Presentation.Win32.Native.manifest.json"
          Copy-Item -LiteralPath (Join-Path native/win-x64 $presenterDll) -Destination (Join-Path $pub $presenterDll) -Force
          Copy-Item -LiteralPath (Join-Path native/win-x64 $presenterManifest) -Destination (Join-Path $pub $presenterManifest) -Force
          ./packaging/windows/verify-win32-presenter.ps1 -Directory $pub -RepositoryRoot $PWD
          ./packaging/windows/smoke-win32-presenter.ps1 -Directory $pub
          if (-not (Test-Path -LiteralPath (Join-Path $pub "OpenRevelare.exe"))) { throw "缺主程序" }
          if (-not (Test-Path -LiteralPath (Join-Path $pub "raw_r.dll"))) { throw "缺 LibRaw 原生库" }
          if (-not (Test-Path -LiteralPath (Join-Path $pub "lcms2.dll"))) { throw "缺 app-owned Little CMS" }
          if (-not (Test-Path -LiteralPath (Join-Path $pub "lcms2.manifest.json"))) { throw "缺 Little CMS manifest" }
          if (-not (Test-Path -LiteralPath (Join-Path $pub $presenterDll))) { throw "缺 Win32 presenter" }
          if (-not (Test-Path -LiteralPath (Join-Path $pub $presenterManifest))) { throw "缺 Win32 presenter manifest" }
          $sourceHash = (Get-FileHash -LiteralPath native/win-x64/lcms2.dll -Algorithm SHA256).Hash
          $publishHash = (Get-FileHash -LiteralPath (Join-Path $pub "lcms2.dll") -Algorithm SHA256).Hash
          if ($sourceHash -ne $publishHash) { throw "publish 中的 lcms2.dll 与 app-owned 构建不一致" }

  # macOS 的构建能力守门。
  #
  # 为什么单开一格：这个项目的 macOS 问题一直只有一条发现渠道 —— 用户报障。ci 只跑
  # ubuntu，release.yml 的 macos job 只在打 tag 时跑，于是任何 mac 专属的破绽都要等到
  # 发版之后才现形。ad-hoc 签名、bash 3.2 的多字节坑、RID 条件没传给类库导致 dylib
  # 不进产物 —— 这些都是已经栽过的跟头（见 build-app.sh 与 Gui.csproj 里的注释）。
  #
  # **不编 LibRaw**：bundle-libraw.sh 要 brew 装依赖再从源码编 0.21.4，几分钟起步，
  # 而它守的是「原生库编得对不对」，那是 release 的事。这一格守的是**托管代码在 osx RID
  # 下编不编得过、publish 的产物齐不齐**，用一个假 dylib 就能验，秒级完成。
  #
  # 假 dylib 不能省：Gui.csproj 的 WarnMissingMacLibRaw 在文件缺失时发 Warning，
  # 而下面带 -warnaserror，缺了它这一格会以一条与本次改动无关的错误常红。
  macos:
    runs-on: macos-latest      # Apple Silicon。Intel 不在 CI 里：托管代码与垫片源码两边一样，
                               # Intel 独有的只是 RID 选择（LittleCmsBundle / ColorManagement.csproj），
                               # 由 release.yml 的 macos-15-intel 那格在真 x86_64 上验，不值得每次 push 都付 ×10 倍率。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 构建固定 Little CMS 2.19.1
        run: bash packaging/lcms/build-unix.sh
      - run: dotnet build -c Release -warnaserror
      # 同一套回归测试也在 macOS 上跑一遍：这里的测试有相当一部分在验数值结果，
      # 而浮点行为、文化相关的数字解析、路径大小写都是跨平台会分岔的地方。
      - run: dotnet test -c Release --no-build --nologo
      # 占位 dylib：只为让按 RID 条件的 Content 项有东西可复制，内容无所谓 —— 这一步
      # 不运行程序，只看装配结果。真库由 release.yml 的 macos job 编。
      - name: 放一个占位 libraw.23.dylib
        run: |
          mkdir -p native/osx-arm64
          echo "placeholder — real dylib is built by packaging/macos/bundle-libraw.sh" \
            > native/osx-arm64/libraw.23.dylib
      # 原生 presenter 垫片（Obj-C++，src/OpenRevelare.Presentation.MacOS.Native）在这里真编，
      # 不放占位：只要 clang + SDK，几秒钟，而它是整个 mac HDR 预览唯一没有第二条发现
      # 渠道的部件 —— 2026-09-13 之前它从没在任何 Mac 上编过一次（见目录 README）。
      # 编译错误在这一格现形，比等用户报"预览退回 SDR"强。
      - name: 编 macOS 原生 presenter
        run: ./packaging/macos/build-macos-presenter.sh
      - run: dotnet publish src/OpenRevelare.Gui -c Release -r osx-arm64 --self-contained true -warnaserror -o /tmp/pub
      - name: 装配 Little CMS manifest
        run: cp native/osx-arm64/lcms2.manifest.json /tmp/pub/lcms2.manifest.json
      - name: 产物自检
        # 这三条正是 v1.0.0 那几次 CI 栽过的地方：dylib 因为 RID 条件写在 Core 里而静默
        # 不复制，包照打，直到 mac 上导入 RAW 才 DllNotFoundException。
        run: |
          test -f /tmp/pub/OpenRevelare         || { echo "缺主程序"; exit 1; }
          test -f /tmp/pub/libraw.23.dylib      || { echo "dylib 没进产物 —— 检查 Gui.csproj 里按 RID 条件的 Content 项"; exit 1; }
          test -f /tmp/pub/liblcms2.2.dylib     || { echo "缺 app-owned Little CMS"; exit 1; }
          test -f /tmp/pub/liblcms2.dylib       || { echo "缺 Little CMS loader alias"; exit 1; }
          test -f /tmp/pub/lcms2.manifest.json  || { echo "缺 Little CMS manifest"; exit 1; }
          cmp -s native/osx-arm64/liblcms2.2.dylib /tmp/pub/liblcms2.2.dylib
          test -f /tmp/pub/libOpenRevelare.Presentation.MacOS.Native.dylib || { echo "缺 macOS presenter 垫片 —— 没有它 HDR/EDR 预览静默退回 SDR 位图"; exit 1; }
          test -f /tmp/pub/models/net_awb.onnx  || { echo "缺 Deep-WB 模型"; exit 1; }
          ls /tmp/pub/*.dll > /dev/null
      # SystemMemory.TryMacOS 依赖的 sysctl 键是否真的存在、是否真的读得出数。
      # 这些键在 Linux 上无法验证，而写错一个键名不会编译失败也不会崩 —— 只会静默
      # 退回按总内存估算，也就是 P5 原本的毛病，无声无息地回来。
      - name: 内存探测所依赖的 sysctl 键
        run: |
          set -e
          # 必须存在的键：缺任何一个，SystemMemory.TryMacOS 就会整体返回 false。
          for k in hw.pagesize vm.page_free_count vm.page_speculative_count \
                   vm.page_purgeable_count; do
            v=$(sysctl -n "$k") || { echo "缺 sysctl 键 $k —— SystemMemory 会退回总内存估算"; exit 1; }
            echo "$k = $v"
            case "$v" in ''|*[!0-9]*) echo "$k 不是无符号整数：$v"; exit 1;; esac
          done
          # vm.page_external_count 在代码里是软读取（缺失时直接跳过，不影响返回值），
          # 部分 macOS 版本（包括 GitHub runner 用的镜像）没有这个键，属正常情况。
          if v=$(sysctl -n vm.page_external_count 2>/dev/null); then
            echo "vm.page_external_count = $v"
          else
            echo "vm.page_external_count 不存在（软读取，正常）"
          fi
          # free 单独为 0 是正常的（统一缓冲区缓存会吃满空闲），但必须键全 0 说明读法有问题。
          total=0
          for k in vm.page_free_count vm.page_speculative_count vm.page_purgeable_count; do
            total=$((total + $(sysctl -n "$k")))
          done
          [ "$total" -gt 0 ] || { echo "三项页计数全为 0 —— 读法有问题"; exit 1; }
          echo "可回收+空闲合计 $((total * $(sysctl -n hw.pagesize) / 1024 / 1024)) MB"
